name: Bug report
description: Report a reproducible behavior or correctness defect using synthetic data.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: Report sensitive vulnerabilities through the private route in SECURITY.md. Do not include source rows, credentials, or customer information.
  - type: input
    id: version
    attributes:
      label: Version and adapter
      description: Include PartitionGuard, Python, database or Delta SDK versions.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with synthetic data
      description: Include minimal contracts, migration bounds, commands, and sanitized errors.
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Execution and recovery state
      description: If relevant, did a write commit, a checkpoint persist, or verification fail? Do not attach a sensitive ledger.
