name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric package version matching an existing vVERSION tag on this commit
        required: true
        type: string
      publish_pypi:
        description: Publish built distributions to PyPI after the protected pypi environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: partitionguard
          POSTGRES_DB: partitionguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PARTITIONGUARD_TEST_POSTGRES: postgresql://postgres:partitionguard@localhost:5432/partitionguard_test
      PG_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify version and reviewed tag
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tomllib
          version = os.environ['PG_RELEASE_VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Version must be a numeric semantic version')
          metadata = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          if metadata['project']['version'] != version:
              raise SystemExit('Package version does not match release input')
          tag = subprocess.check_output(['git', 'rev-parse', f'refs/tags/v{version}^{{commit}}'], text=True).strip()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if tag != head:
              raise SystemExit('Matching release tag must point at this exact commit')
          if not pathlib.Path(f'docs/releases/{version}.md').is_file():
              raise SystemExit('Checked-in release notes are required')
          PY
      - run: python -m pip install -e '.[dev,duckdb,postgres,delta,aws]' 'twine>=6,<7'
      - run: python -m ruff check .
      - run: python -m ruff format --check src tests examples benchmarks
      - run: python -m pytest
      - run: python -m mkdocs build --strict
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and exercise the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/partitionguard-wheel"
          "$RUNNER_TEMP/partitionguard-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/partitionguard-wheel/bin/partitionguard" --help
          "$RUNNER_TEMP/partitionguard-wheel/bin/python" - <<'PY'
          import importlib.util
          import pathlib
          import subprocess
          import sys
          import tempfile
          for sdk in ('duckdb', 'psycopg', 'deltalake', 'pyarrow', 'boto3'):
              assert importlib.util.find_spec(sdk) is None, sdk
          cli = str(pathlib.Path(sys.executable).with_name('partitionguard'))
          with tempfile.TemporaryDirectory() as directory:
              def run(*args):
                  return subprocess.run([cli, *args], cwd=directory, stdout=subprocess.DEVNULL).returncode
              assert run('init', 'contracts') == 0
              assert run('plan', 'contracts/current.yaml', 'contracts/proposed.yaml', '--migration', 'contracts/migration.yaml', '--ci') == 0
              assert run('plan', 'contracts/current.yaml', 'contracts/breaking.yaml', '--ci') == 3
          print('Built wheel plans safely with no optional SDK installed')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PG_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Create a reviewable draft release
        run: gh release create "v${PG_RELEASE_VERSION}" --verify-tag --draft --prerelease --title "PartitionGuard v${PG_RELEASE_VERSION}" --notes-file "docs/releases/${PG_RELEASE_VERSION}.md" dist/*

  publish-pypi:
    if: ${{ inputs.publish_pypi }}
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Publish with configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
