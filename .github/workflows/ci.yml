name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        profile: [current]
        include:
          - python: '3.11'
            profile: minimum
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: partitionguard
          POSTGRES_DB: partitionguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PARTITIONGUARD_TEST_POSTGRES: postgresql://postgres:partitionguard@localhost:5432/partitionguard_test
      PARTITIONGUARD_REQUIRE_INFRA: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-minimum.txt
      - name: Install current dependencies
        if: matrix.profile == 'current'
        run: python -m pip install -e '.[dev,duckdb,postgres,delta,aws]'
      - name: Install minimum supported direct dependencies
        if: matrix.profile == 'minimum'
        run: python -m pip install -c requirements-minimum.txt -e '.[dev,duckdb,postgres,delta,aws]'
      - run: python -m pip check
      - name: Ensure disposable PostgreSQL server binaries are available
        run: |
          if ! command -v initdb >/dev/null && ! compgen -G '/usr/lib/postgresql/*/bin/initdb' >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
      - run: python -m pytest --cov=partitionguard --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - name: Rehearse recovery from the previous wheel
        if: matrix.python == '3.12'
        run: |
          mkdir -p "$RUNNER_TEMP/partitionguard-previous-src"
          git archive edeb0887d2ea1e21cbfce72e9dfcb0276dc76857 | tar -x -C "$RUNNER_TEMP/partitionguard-previous-src"
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/partitionguard-previous-dist" "$RUNNER_TEMP/partitionguard-previous-src"
          python -m pip freeze --exclude partitionguard > "$RUNNER_TEMP/partitionguard-upgrade-deps.txt"
          python -m venv "$RUNNER_TEMP/partitionguard-previous"
          "$RUNNER_TEMP/partitionguard-previous/bin/python" -m pip install \
            -c "$RUNNER_TEMP/partitionguard-upgrade-deps.txt" \
            "$RUNNER_TEMP/partitionguard-previous-dist/partitionguard-0.1.0-py3-none-any.whl[duckdb,postgres,delta]"
          PARTITIONGUARD_PREVIOUS_PYTHON="$RUNNER_TEMP/partitionguard-previous/bin/python" \
            python -m pytest tests/upgrade_rehearsal.py -q --junitxml=upgrade-rehearsal.xml
      - name: Execute all documented tutorials
        if: matrix.python == '3.12'
        run: python examples/run_tutorials.py --output "$RUNNER_TEMP/partitionguard-tutorials"
      - name: Demonstrate process-crash recovery and evidence export
        if: matrix.python == '3.12'
        run: python examples/recovery_report.py --output "$RUNNER_TEMP/partitionguard-evidence"
      - name: Demonstrate approved canary, durable pause and continuation
        if: matrix.python == '3.12'
        run: python examples/controlled_execution.py --output "$RUNNER_TEMP/partitionguard-controls"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.python == '3.12'
        with:
          name: execution-controls
          path: |
            ${{ runner.temp }}/partitionguard-controls/canary.json
            ${{ runner.temp }}/partitionguard-controls/completed.html
            ${{ runner.temp }}/partitionguard-controls/completed.json
            ${{ runner.temp }}/partitionguard-controls/transcript.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.python == '3.12'
        with:
          name: migration-evidence
          path: |
            ${{ runner.temp }}/partitionguard-evidence/*.html
            ${{ runner.temp }}/partitionguard-evidence/recovered.json
            ${{ runner.temp }}/partitionguard-evidence/corrupted.json
            ${{ runner.temp }}/partitionguard-evidence/repaired.json
            ${{ runner.temp }}/partitionguard-evidence/transcript.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-python-${{ matrix.python }}${{ matrix.profile == 'minimum' && '-minimum' || '' }}
          path: |
            coverage.xml
            test-results.xml
            upgrade-rehearsal.xml
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check src tests examples benchmarks
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install and exercise the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/partitionguard-wheel"
          "$RUNNER_TEMP/partitionguard-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/partitionguard-wheel/bin/partitionguard" --help
          "$RUNNER_TEMP/partitionguard-wheel/bin/python" - <<'PY'
          import importlib.util
          import pathlib
          import subprocess
          import sys
          import tempfile
          for sdk in ('duckdb', 'psycopg', 'deltalake', 'pyarrow', 'boto3'):
              assert importlib.util.find_spec(sdk) is None, sdk
          cli = str(pathlib.Path(sys.executable).with_name('partitionguard'))
          with tempfile.TemporaryDirectory() as directory:
              def run(*args):
                  return subprocess.run([cli, *args], cwd=directory, stdout=subprocess.DEVNULL).returncode
              assert run('init', 'contracts') == 0
              assert run('plan', 'contracts/current.yaml', 'contracts/proposed.yaml', '--migration', 'contracts/migration.yaml', '--ci') == 0
              assert run('plan', 'contracts/current.yaml', 'contracts/breaking.yaml', '--ci') == 3
          print('Built wheel plans safely with no optional SDK installed')
          PY
      - run: python -m mkdocs build --strict
