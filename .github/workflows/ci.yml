name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: partitionguard
          POSTGRES_DB: partitionguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PARTITIONGUARD_TEST_POSTGRES: postgresql://postgres:partitionguard@localhost:5432/partitionguard_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,duckdb,postgres,delta,aws]'
      - run: python -m pytest --cov=partitionguard --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - name: Demonstrate failure, recovery, verification and repair
        if: matrix.python == '3.12'
        run: python examples/showcase.py --json > showcase.json
      - name: Exercise all documented tutorials
        if: matrix.python == '3.12'
        run: python examples/run_tutorials.py --output "$RUNNER_TEMP/partitionguard-tutorials"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-python-${{ matrix.python }}
          path: |
            coverage.xml
            test-results.xml
            showcase.json
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' 'twine>=6,<7'
      - run: python -m ruff check .
      - run: python -m ruff format --check src tests examples benchmarks
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and exercise the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/partitionguard-wheel"
          "$RUNNER_TEMP/partitionguard-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/partitionguard-wheel/bin/partitionguard" --help
          "$RUNNER_TEMP/partitionguard-wheel/bin/python" - <<'PY'
          import importlib.util
          import pathlib
          import subprocess
          import sys
          import tempfile
          for sdk in ('duckdb', 'psycopg', 'deltalake', 'pyarrow', 'boto3'):
              assert importlib.util.find_spec(sdk) is None, sdk
          cli = str(pathlib.Path(sys.executable).with_name('partitionguard'))
          with tempfile.TemporaryDirectory() as directory:
              def run(*args):
                  return subprocess.run([cli, *args], cwd=directory, stdout=subprocess.DEVNULL).returncode
              assert run('init', 'contracts') == 0
              assert run('plan', 'contracts/current.yaml', 'contracts/proposed.yaml', '--migration', 'contracts/migration.yaml', '--ci') == 0
              assert run('plan', 'contracts/current.yaml', 'contracts/breaking.yaml', '--ci') == 3
          print('Built wheel plans safely with no optional SDK installed')
          PY
      - run: python -m mkdocs build --strict
