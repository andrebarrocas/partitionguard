[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "partitionguard"
version = "0.1.0"
description = "Safely plan, execute, recover, and verify changes to production data products."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "André Barrocas"}]
maintainers = [{name = "André Barrocas"}]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Programming Language :: Python :: 3", "Topic :: Database"]
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "typer>=0.15,<1", "rich>=13,<15", "sqlglot>=26,<30"]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
duckdb = ["duckdb>=1.2,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
delta = ["deltalake>=1.6.6,<2", "pyarrow>=23,<24", "duckdb>=1.2,<2"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "pytest-cov>=6,<8", "ruff>=0.11", "build>=1", "mkdocs>=1.6,<2"]

[project.scripts]
partitionguard = "partitionguard.cli:app"

[project.urls]
Homepage = "https://github.com/andrebarrocas/partitionguard"
Repository = "https://github.com/andrebarrocas/partitionguard"
Issues = "https://github.com/andrebarrocas/partitionguard/issues"
Documentation = "https://github.com/andrebarrocas/partitionguard#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/partitionguard"]
# Twine 6 supports 2.4; build-tool upgrades must not silently change this format.
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires an external PostgreSQL server", "delta: requires the Delta extra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/docs", "/examples", "/benchmarks", "/.github", "/README.md", "/LICENSE", "/NOTICE", "/CONTRIBUTING.md", "/CODE_OF_CONDUCT.md", "/SECURITY.md", "/CHANGELOG.md", "/architecture.md", "/roadmap.md", "/plugin-development.md", "/pyproject.toml", "/mkdocs.yml", "/Makefile", "/.gitignore", "/.gitattributes", "/requirements-tested.txt"]
exclude = ["**/__pycache__/**", "**/*.pyc", "/site/**", "/dist/**", "/build/**", "/work/**"]
